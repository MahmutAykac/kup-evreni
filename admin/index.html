<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Küp Evreni Admin</title>
<!--
  Küp Evreni admin paneli: ayrı sayfa (ana sayfada hiçbir giriş yolu yok).
  Platformla aynı localStorage'ı okur/yazar: kupEvreni (aktif hesap), kupEvreniHesaplar (diğer hesaplar), oyunların saveKey'leri.
  localStorage adrese bağlıdır: admin, oyunun oynandığı adresle aynı yerden açılmalı (file:// ≠ localhost ≠ github.io).
  Değiştirilen şifrenin SHA-256 özeti kupEvreniAdmin anahtarında durur (sadece o cihazda geçerli).
  Giriş sessionStorage'da tutulur (kupAdminOturum): sayfa yenilenince atmaz, 12 saat ya da Çıkış ile biter.
  Her şey tarayıcıda çalıştığı için gerçek bir güvenlik değildir.
-->
<style>
  :root {
    --bg: #0d0e12;
    --surface: #16181d;
    --surface2: #1e2128;
    --surface3: #262a33;
    --line: rgba(255, 255, 255, 0.08);
    --line2: rgba(255, 255, 255, 0.14);
    --text: #f2f3f5;
    --text2: #c4c7cf;
    --muted: #8a8f9a;
    --accent: #00a2ff;
    --accent-soft: rgba(0, 162, 255, 0.14);
    --play: #00b06f;
    --play-soft: rgba(0, 176, 111, 0.14);
    --gold: #ffd166;
    --gold-soft: rgba(255, 209, 102, 0.12);
    --red: #ff4d5e;
    --red-soft: rgba(255, 77, 94, 0.12);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Trebuchet MS", system-ui, sans-serif; font-size: 15px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); text-decoration: none; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* Butonlar ve alanlar */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--line2); background: var(--surface2); cursor: pointer; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .btn:hover { background: var(--surface3); }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.green { background: var(--play); border-color: transparent; color: #fff; }
  .btn.danger { background: var(--red-soft); border-color: rgba(255, 77, 94, 0.35); color: var(--red); }
  .btn.danger:hover { background: var(--red); color: #fff; }
  .btn.ghost { background: none; border-color: transparent; }
  .btn.ghost:hover { background: var(--surface2); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
  .field { height: 38px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg); padding: 0 12px; width: 100%; }
  .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  label.lbl { display: block; font-size: 13px; color: var(--text2); margin: 12px 0 6px; font-weight: 700; }

  /* Giriş ekranı */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(circle at 20% 10%, rgba(0, 162, 255, 0.16), transparent 45%), radial-gradient(circle at 85% 90%, rgba(0, 176, 111, 0.12), transparent 45%), var(--bg); }
  .loginCard { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 30px 26px 26px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: 0.02em; }
  .brand i { width: 26px; height: 26px; background: var(--text); transform: rotate(14deg); border-radius: 4px; display: grid; place-items: center; }
  .brand i::after { content: ""; width: 9px; height: 9px; background: var(--surface); }
  .brand small { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 3px 7px; border-radius: 6px; letter-spacing: 0.04em; }
  .loginCard h1 { font-size: 22px; margin: 26px 0 4px; }
  .pw { position: relative; }
  .pw .field { padding-right: 44px; height: 44px; }
  .pw button { position: absolute; right: 4px; top: 4px; height: 36px; width: 36px; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 8px; }
  .pw button:hover { color: var(--text); background: var(--surface2); }
  .loginCard .btn.primary { width: 100%; height: 44px; margin-top: 16px; font-size: 15px; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .shake { animation: shake 0.35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* Uygulama iskeleti */
  #app { display: none; min-height: 100vh; }
  #app.on { display: grid; grid-template-columns: 236px minmax(0, 1fr); }
  aside { position: sticky; top: 0; height: 100vh; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; }
  aside .brand { padding: 0 8px 18px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .navTitle { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 10px 6px; }
  #nav { flex: 1; overflow-y: auto; min-height: 0; margin: 0 -4px; padding: 0 4px; }
  nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 10px;
    cursor: pointer; color: var(--text2); font-weight: 700; text-align: left; }
  nav button:hover { background: var(--surface2); color: var(--text); }
  nav button.on { background: var(--accent-soft); color: var(--accent); }
  nav .count { margin-left: auto; font-size: 12px; background: var(--surface3); color: var(--text2); padding: 1px 8px; border-radius: 20px; }
  aside .foot { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); }
  aside .foot .btn { justify-content: flex-start; width: 100%; color: var(--text2); }

  .content { min-width: 0; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: rgba(13, 14, 18, 0.85);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 20px; margin: 0; }
  header .crumb { font-size: 13px; color: var(--muted); }
  .search { position: relative; margin-left: auto; width: 260px; }
  .search svg { position: absolute; left: 11px; top: 10px; color: var(--muted); }
  .search .field { padding-left: 36px; }
  #menuBtn { display: none; }
  .page { padding: 24px 28px 60px; max-width: 1200px; }

  /* Kartlar */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .cardHead { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; }
  .cardHead h2 { font-size: 15px; margin: 0; }
  .cardHead .sub { font-size: 13px; color: var(--muted); }
  .cardHead .right { margin-left: auto; }
  .cardBody { padding: 16px 18px 18px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi { padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; }
  .kpi .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .kpi .ico svg { width: 20px; height: 20px; }
  .kpi span { font-size: 13px; color: var(--muted); display: block; }
  .kpi b { font-size: 24px; display: block; margin-top: 2px; }
  .kpi small { font-size: 12px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 16px; }

  /* Yatay çubuk grafik (tek seri) */
  .bars { display: flex; flex-direction: column; gap: 12px; }
  .barRow { display: grid; grid-template-columns: 170px 1fr 64px; gap: 12px; align-items: center; font-size: 13px; position: relative; cursor: default; }
  .barRow .lab { color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barRow .track { height: 22px; display: flex; align-items: center; }
  .barRow .fill { height: 14px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; transition: filter 0.1s; }
  .barRow:hover .fill { filter: brightness(1.25); }
  .barRow .val { text-align: right; color: var(--text2); }
  .chartGrid { position: relative; }
  #tip { position: fixed; pointer-events: none; z-index: 60; background: var(--surface3); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 10px;
    font-size: 13px; display: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
  #tip b { display: block; margin-bottom: 2px; }

  /* Tablolar */
  .tableWrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 10px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 12px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover td { background: var(--surface2); }
  th.r, td.r { text-align: right; }
  .user { display: flex; align-items: center; gap: 10px; }
  .ava { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; flex: none; box-shadow: 0 0 0 2px var(--surface); }
  .user b { display: block; }
  .user small { color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
  .pill.green { background: var(--play-soft); color: var(--play); }
  .pill.gray { background: var(--surface3); color: var(--text2); }
  .pill.gold { background: var(--gold-soft); color: var(--gold); }
  .pill.green::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .robux { color: var(--gold); font-weight: 700; }
  .gameIco { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 19px; flex: none; }

  /* Boş durum */
  .empty { text-align: center; padding: 40px 20px; }
  .empty .big { width: 56px; height: 56px; border-radius: 16px; background: var(--surface2); display: grid; place-items: center; margin: 0 auto 14px; color: var(--muted); }
  .empty .big svg { width: 26px; height: 26px; }
  .empty h3 { margin: 0 0 6px; font-size: 17px; }
  .empty p { margin: 0 auto; max-width: 520px; color: var(--muted); line-height: 1.55; }
  .empty code { background: var(--surface2); padding: 2px 6px; border-radius: 6px; color: var(--text2); }
  .empty .btn { margin-top: 16px; }

  /* Kullanıcı çekmecesi */
  #scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.18s; }
  #scrim.on { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 21;
    transform: translateX(100%); transition: transform 0.2s ease; display: flex; flex-direction: column; }
  #drawer.on { transform: none; }
  .dHead { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .dHead .ava { width: 52px; height: 52px; font-size: 26px; }
  .dHead h2 { margin: 0; font-size: 19px; }
  .dHead .btn { margin-left: auto; }
  .dBody { padding: 18px 20px 30px; overflow-y: auto; flex: 1; }
  .sec { margin-bottom: 22px; }
  .sec h3 { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 10px; }
  .miniStats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .miniStats div { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
  .miniStats b { display: block; font-size: 16px; }
  .miniStats span { font-size: 12px; color: var(--muted); }
  .balance { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .balance b { font-size: 28px; color: var(--gold); }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .amountRow { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; }
  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface2);
    cursor: pointer; text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); }
  .chip .e { font-size: 18px; filter: grayscale(1); opacity: 0.5; }
  .chip.on { border-color: rgba(0, 176, 111, 0.5); background: var(--play-soft); color: var(--text); }
  .chip.on .e { filter: none; opacity: 1; }
  .chip .tick { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line2); }
  .chip.on .tick { background: var(--play); border-color: var(--play); }
  .list div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .list div:last-child { border-bottom: 0; }
  .dangerZone { border: 1px solid rgba(255, 77, 94, 0.3); border-radius: 12px; padding: 14px; }
  .dangerZone p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }

  /* Ayarlar */
  .settings { display: grid; gap: 16px; max-width: 640px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .kv:last-child { border-bottom: 0; }
  .kv code { color: var(--text2); word-break: break-all; text-align: right; }

  /* Bildirim */
  #toast { position: fixed; right: 20px; bottom: 20px; z-index: 70; display: flex; align-items: center; gap: 10px; background: var(--surface3); border: 1px solid var(--line2);
    border-left: 4px solid var(--play); padding: 12px 16px; border-radius: 12px; font-weight: 700; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    transform: translateY(20px); opacity: 0; pointer-events: none; transition: 0.18s; }
  #toast.on { transform: none; opacity: 1; }
  #toast.bad { border-left-color: var(--red); }

  /* Silme onayı (DELETE yaz) */
  #confirm { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.6); display: none; align-items: center; justify-content: center; padding: 16px; }
  #confirm.on { display: flex; }
  .cBox { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line2); border-radius: 18px; padding: 22px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); }
  .cBox .warn { width: 44px; height: 44px; border-radius: 12px; background: var(--red-soft); color: var(--red); display: grid; place-items: center; margin-bottom: 14px; }
  .cBox .warn svg { width: 22px; height: 22px; }
  .cBox h3 { margin: 0 0 6px; font-size: 18px; }
  .cBox p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .cBox code { background: var(--red-soft); color: var(--red); padding: 1px 6px; border-radius: 6px; font-weight: 700; }
  .cBox .field { margin-top: 14px; font-weight: 700; letter-spacing: 0.06em; }
  .cBox .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .btn.dangerSolid { background: var(--red); border-color: transparent; color: #fff; }

/* Yönetim sayfaları: anahtar, form ızgarası, öğe listeleri */
  .tg { position: relative; width: 44px; height: 24px; border-radius: 20px; border: 0; background: var(--surface3); cursor: pointer; flex: none; transition: background 0.15s; }
  .tg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
  .tg.on { background: var(--play); }
  .tg.on::after { transform: translateX(20px); }
  .formGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 4px 14px; }
  .formGrid .lbl { margin-top: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .rowLine { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .rowLine:last-child { border-bottom: 0; }
  .rowLine .grow { flex: 1; min-width: 0; }
  .rowLine b { display: block; }
  .rowLine small { color: var(--muted); font-size: 13px; }
  .stack { display: grid; gap: 16px; max-width: 900px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface2); cursor: pointer; font-weight: 700; font-size: 13px; }
  .seg button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  textarea.field { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
  .banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; font-weight: 700; line-height: 1.4; border: 1px solid rgba(255,255,255,0.12); }
  .banner .bi { font-size: 22px; }
  .banner.info { background: linear-gradient(90deg, rgba(0,162,255,0.22), rgba(0,162,255,0.08)); }
  .banner.success { background: linear-gradient(90deg, rgba(0,176,111,0.24), rgba(0,176,111,0.08)); }
  .banner.warn { background: linear-gradient(90deg, rgba(255,209,102,0.24), rgba(255,209,102,0.08)); }
  .banner.event { background: linear-gradient(90deg, rgba(167,112,255,0.3), rgba(255,94,170,0.14)); }
  .banner.fresh { background: linear-gradient(90deg, rgba(255,59,92,0.28), rgba(255,122,69,0.1)); }
  .swList { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .swItem { position: relative; width: 40px; height: 40px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); }
  .swItem button { position: absolute; right: -6px; top: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--red); color: #fff; cursor: pointer; font-size: 12px; line-height: 20px; padding: 0; }
  .itemIco { width: 44px; height: 44px; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; font-size: 24px; flex: none; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; vertical-align: -2px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); }
  .meter { height: 8px; background: var(--surface3); border-radius: 6px; overflow: hidden; width: 140px; }
  .meter i { display: block; height: 100%; background: var(--play); border-radius: 0 4px 4px 0; }
  .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; letter-spacing: 0.04em; }
  input[type=color].field { padding: 4px; cursor: pointer; }
  @media (max-width: 760px) { .meter { width: 70px; } }

  /* Telefon / dar ekran */
  @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    #app.on { grid-template-columns: minmax(0, 1fr); }
    aside { position: fixed; left: 0; top: 0; bottom: 0; width: 250px; z-index: 30; transform: translateX(-100%); transition: transform 0.2s; }
    aside.open { transform: none; box-shadow: 20px 0 60px rgba(0, 0, 0, 0.5); }
    #menuBtn { display: inline-flex; }
    header { padding: 12px 16px; flex-wrap: wrap; }
    .search { width: 100%; order: 5; margin-left: 0; }
    .page { padding: 16px 16px 50px; }
    .kpi { padding: 14px; } .kpi .ico { display: none; } .kpi b { font-size: 19px; white-space: nowrap; }
    .barRow { grid-template-columns: 100px 1fr 70px; } .barRow .val { white-space: nowrap; }
    th, td { padding: 10px 12px; }
    .hideSm { display: none; }
  }
</style>
</head>
<body>

<!-- Giriş -->
<div id="login">
  <form class="loginCard" id="loginForm" autocomplete="off">
    <div class="brand"><i></i>KÜP EVRENİ <small>ADMIN</small></div>
    <h1>Yönetici girişi</h1>
    <div class="muted" style="font-size:14px">Devam etmek için admin şifresini gir.</div>
    <label class="lbl" for="pass">Şifre</label>
    <div class="pw">
      <input class="field" type="password" id="pass" placeholder="••••••••" autofocus>
      <button type="button" id="eye" title="Şifreyi göster"></button>
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit">Giriş yap</button>
  </form>
</div>

<!-- Panel -->
<div id="app">
  <aside id="side">
    <div class="brand"><i></i>KÜP EVRENİ <small>ADMIN</small></div>
    <nav id="nav"></nav>
    <div class="foot">
      <a class="btn ghost" href="../index.html" id="siteLink"></a>
      <button class="btn ghost" id="btnLogout"></button>
    </div>
  </aside>
  <div class="content">
    <header>
      <button class="btn ghost" id="menuBtn" aria-label="Menü"></button>
      <div><div class="crumb">Admin</div><h1 id="pageTitle"></h1></div>
      <div class="search"><span id="searchIco"></span><input class="field" id="search" placeholder="Kullanıcı ara…"></div>
    </header>
    <div class="page" id="page"></div>

// ================================================================ Yardımcılar
function sha256(str) { // crypto.subtle telefonda (http://192.168...) yok, o yüzden elle
  const K = [], H = [];
  for (let p = 2, c = 0; c < 64; p++) {
    let prime = true;
    for (let d = 2; d * d <= p; d++) if (p % d === 0) { prime = false; break; }
    if (!prime) continue;
    if (c < 8) H[c] = (Math.pow(p, 1 / 2) * 2 ** 32) | 0;
    K[c++] = (Math.pow(p, 1 / 3) * 2 ** 32) | 0;
  }
  const b = [...new TextEncoder().encode(str)], len = b.length * 8;
  b.push(0x80); while (b.length % 64 !== 56) b.push(0);
  for (let i = 7; i >= 0; i--) b.push(i >= 4 ? 0 : (len >>> (i * 8)) & 255);
  const rr = (v, n) => (v >>> n) | (v << (32 - n));
  for (let o = 0; o < b.length; o += 64) {
    const w = [];
    for (let i = 0; i < 64; i++) {
      if (i < 16) w[i] = (b[o + i * 4] << 24) | (b[o + i * 4 + 1] << 16) | (b[o + i * 4 + 2] << 8) | b[o + i * 4 + 3];
      else {
        const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
    }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    [a, bb, c, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key) || "null") ?? fallback; } catch (e) { return fallback; } }

function users() {

  return list;
}

  } catch (e) { return false; }
}

const CFG_KEY = "kupEvreniAyar", LOG_KEY = "kupEvreniAdminLog";
const ECO_DEFAULT = { daily: 100, play: 15, badge: 25, start: 200, double: false };
const SHAPES = [["cap", "Şapka"], ["crown", "Taç"], ["headphones", "Kulaklık"], ["helmet", "Uzay kaskı"], ["tophat", "Silindir şapka"], ["halo", "Hale"], ["horns", "Boynuz"], ["beanie", "Bere"]];
const ANN_TYPES = [["info", "📢 Bilgi"], ["success", "✅ Başarı"], ["warn", "⚠️ Uyarı"], ["event", "🎉 Etkinlik"], ["fresh", "🆕 Yeni Eklenen"]];
const cfg = () => load(CFG_KEY, {}) || {};
function setCfg(fn) { const c = cfg(); fn(c); save(CFG_KEY, c); }
const eco = () => ({ ...ECO_DEFAULT, ...(cfg().eco || {}) });
const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function logAct(text) { const l = load(LOG_KEY, []); l.unshift({ at: Date.now(), text }); save(LOG_KEY, l.slice(0, 300)); }
const tg = (on, attrs) => `<button class="tg ${on ? "on" : ""}" ${attrs} aria-pressed="${!!on}"></button>`;
// Sayı kutuları (data-num): yazarken binlik nokta konur (19.000.000), okurken noktalar atılır
const numVal = el => { const d = String(el.value).replace(/\D/g, ""); return d === "" ? null : Number(d); };
document.addEventListener("input", e => {
  const el = e.target;
  if (!el.matches || !el.matches("input[data-num]")) return;
  const before = el.value.slice(0, el.selectionStart).replace(/\D/g, "").length; // imleçten önceki rakam sayısı
  const d = el.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 12);
  el.value = d ? Number(d).toLocaleString("tr") : "";
  let i = 0;
  for (let n = 0; i < el.value.length && n < before; i++) if (/\d/.test(el.value[i])) n++;
  el.setSelectionRange(i, i);
});
const intVal = (id, min = 0, max = 1000000) => { const v = numVal($(id)); return v !== null && v >= min && v <= max ? v : null; };

          <td class="r" style="display:flex;gap:6px;justify-content:flex-end;align-items:center">${tg(!c.off, `data-ctog="${i}" title="Aktif / pasif"`)}<button class="btn sm danger" data-cdel="${i}">${ic("trash")}</button></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><div class="big">${ic("ticket")}</div><h3>Henüz kod yok</h3><p>Yukarıdan bir kod oluştur, oyuncular Robux kazansın.</p></div>`}</div></div>`;
  $("btnRand").onclick = () => { const A = "ABCDEFGHJKLMNPRSTUVYZ23456789"; $("cCode").value = "KUP" + Array.from({ length: 5 }, () => A[Math.floor(Math.random() * A.length)]).join(""); };
  $("btnCode").onclick = () => {
    const code = $("cCode").value.trim().toLocaleUpperCase("tr");
    if (!/^[A-Z0-9ÇĞİÖŞÜ_-]{3,20}$/.test(code)) { toast("Kod 3-20 harf veya rakam olmalı (boşluksuz)", true); return; }
    if ((cfg().codes || []).some(c => c.code === code)) { toast("Bu kod zaten var", true); return; }
    const amount = intVal("cAmt", 1, 100000), max = intVal("cMax", 0, 100000);
    if (amount === null) { toast("Robux 1 ile 100.000 arası olmalı", true); return; }
    if (max === null) { toast("Kullanım limiti geçerli bir sayı olmalı", true); return; }
    setCfg(c => c.codes = [{ code, amount, max, expires: $("cExp").value || "", used: 0, at: Date.now() }, ...(c.codes || [])]);
    logAct(`Promo kod oluşturuldu: ${code} (R$ ${amount}${max ? `, ${max} kullanım` : ""})`); toast(`${code} oluşturuldu`); render();
  };
  $("page").querySelectorAll("[data-ctog]").forEach(b => b.onclick = () => {
    let msg; setCfg(c => { const k = c.codes[+b.dataset.ctog]; k.off = !k.off; msg = `${k.code} ${k.off ? "pasif yapıldı" : "aktif yapıldı"}`; });
    logAct("Promo kod " + msg); toast(msg); render();
  });
  $("page").querySelectorAll("[data-cdel]").forEach(b => b.onclick = () => {
    const k = (cfg().codes || [])[+b.dataset.cdel]; if (!k || !confirm(`${k.code} kodu silinsin mi?`)) return;
    setCfg(c => c.codes.splice(+b.dataset.cdel, 1)); logAct(`Promo kod silindi: ${k.code}`); toast("Kod silindi"); render();
  });
}

    <div class="card"><div class="cardHead"><h2>Yeni yüz</h2></div><div class="cardBody">
      <div class="formGrid">
        <div><label class="lbl" for="fName">İsim</label><input class="field" id="fName" maxlength="24" placeholder="Havalı Kedi"></div>

        <div><label class="lbl" for="fPrice">Fiyat (R$)</label><input class="field num" type="text" inputmode="numeric" data-num id="fPrice" value="0"><div class="hint">0 = ücretsiz</div></div>
      </div><button class="btn primary" id="btnFace" style="margin-top:18px">${ic("plus")}Yüz ekle</button></div>
      ${(av.faces || []).length ? `<div class="cardBody" style="padding-top:0">${av.faces.map((f, i) => `<div class="rowLine"><span class="itemIco">${esc(f.emoji)}</span>
        <div class="grow"><b>${esc(f.name)}</b><small>${owners(f.id)} sahip · ${wearing(f.id, "face")} kullanıyor</small></div>${price(f.price)}
        <button class="btn sm danger" data-fdel="${i}">${ic("trash")}</button></div>`).join("")}</div>` : ""}</div>

    setCfg(c => { c.avatar = c.avatar || {}; c.avatar.hats = [...(c.avatar.hats || []), { id: newId(), name, shape: $("hShape").value, color: $("hColor").value, price: p }]; });

  };

    const t = $("sTarget").value, col = $("sColor").value;
    if ((cfg().avatar?.[t] || []).includes(col)) { toast("Bu renk zaten ekli", true); return; }
    setCfg(c => { c.avatar = c.avatar || {}; c.avatar[t] = [...(c.avatar[t] || []), col]; });
    logAct(`Avatar rengi eklendi: ${col} (${t === "skins" ? "ten" : "kıyafet"})`); toast("Renk eklendi"); render();
  };

    const i = +b.getAttribute(attr), it = (cfg().avatar?.[key] || [])[i];

    setCfg(c => c.avatar[key].splice(i, 1)); logAct(`Avatar öğesi silindi: ${label(it)}`); toast("Silindi"); render();
  });
  del("data-hdel", "hats", h => h.name); del("data-fdel", "faces", f => `${f.emoji} ${f.name}`);
  $("page").querySelectorAll("[data-sdel]").forEach(b => b.onclick = () => {
    const [k, i] = b.dataset.sdel.split(":"), col = (cfg().avatar?.[k] || [])[+i];
    setCfg(c => c.avatar[k].splice(+i, 1)); logAct(`Avatar rengi silindi: ${col}`); toast("Renk silindi"); render();
  });
}

function renderBadges() {

  $("page").innerHTML = `<div class="card"><div class="cardHead"><h2>Rozetler</h2><span class="sub">${u.length} kullanıcı</span></div>
    ${!u.length ? emptyUsers() : `<div class="tableWrap" style="margin-top:10px"><table>
      <thead><tr><th>Rozet</th><th>Sahip</th><th class="hideSm"></th><th></th></tr></thead>
      <tbody>${BADGES.map(b => { const n = u.filter(x => x.a.badges?.[b.id]).length;
        return `<tr><td><div class="user"><span class="itemIco" style="width:38px;height:38px;font-size:20px">${b.icon}</span><b>${b.name}</b></div></td>
          <td class="num">${n} / ${u.length}</td><td class="hideSm"><div class="meter"><i style="width:${u.length ? n / u.length * 100 : 0}%"></i></div></td>

    <div class="cardBody hint">Panelden verilen rozetler Robux ödülü vermez.</div></div>`;
  const each = (id, on) => { users().forEach(x => { const a = x.a; a.badges = { ...(a.badges || {}) }; if (on) a.badges[id] = true; else delete a.badges[id]; putUser(x.uid, a); }); };
  $("page").querySelectorAll("[data-ball]").forEach(b => b.onclick = () => { const r = BADGES.find(x => x.id === b.dataset.ball); each(r.id, true); logAct(`Rozet herkese verildi: ${r.icon} ${r.name}`); toast(`${r.name} herkese verildi`); render(); });
  $("page").querySelectorAll("[data-bnone]").forEach(b => b.onclick = () => { const r = BADGES.find(x => x.id === b.dataset.bnone); if (!confirm(`${r.name} rozeti herkesten alınsın mı?`)) return; each(r.id, false); logAct(`Rozet herkesten alındı: ${r.icon} ${r.name}`); toast(`${r.name} herkesten alındı`); render(); });
}

const fillTpl = (tpl, vals) => String(tpl).replace(/\{(\w+)\}/g, (_, k) => vals[k] ?? "");
const getPath = (obj, p) => p.split(".").reduce((o, k) => o == null ? undefined : o[k], obj);
// Oyun kaydında bu eşyadan kaç tane var (bilinmiyorsa null). Oyun kayıtları hesaba değil cihaza bağlıdır.
function ownedCount(gameId, item, vals) {
  const g = GAMES.find(x => x.id === gameId), sv = g && load(g.saveKey, null);
  if (!sv) return item.own || item.ownList ? 0 : null;
  if (item.own) { const v = getPath(sv, fillTpl(item.own, vals)); return typeof v === "number" ? v : v ? 1 : 0; }
  if (item.ownList) {
    const arr = getPath(sv, item.ownList.path);
    if (!Array.isArray(arr)) return 0;
    return arr.filter(x => x && Object.entries(item.ownList.match).every(([k, t]) => String(x[k]) === fillTpl(t, vals))).length;
  }
  return null;
}
function itemLabel(item, vals, n) {
  const ps = Object.keys(item.params || {});
  const name = ps.length ? ps.map(p => (item.params[p].find(o => o[0] === vals[p]) || [, vals[p]])[1]).join(" · ") : `${item.icon} ${item.name}`;
  return name + (item.kind === "once" ? "" : ` ×${fmtNum(n)}`);
}
let gift = { to: "*", game: null, item: 0, vals: {}, basket: [] };
function renderGifts() {

  const cat = GIFT_CATALOG[gift.game] || [], item = cat[gift.item] || cat[0];
  if (item) for (const [p, opts] of Object.entries(item.params || {})) if (!opts.some(o => o[0] === gift.vals[p])) gift.vals[p] = opts[0][0];
  const own = item ? ownedCount(gift.game, item, gift.vals) : null;
  const key = item ? fillTpl(item.key, gift.vals) : "";
  const waitingFor = [...new Set(st.pending.filter(p => p.game === gift.game && (gift.to === "*" || p.to === gift.to) && p.items.some(it => it.key === key)).map(p => p.to))];
  const inBasket = gift.basket.some(b => b.key === key && b.game === gift.game);
  const ownedOnce = item && item.kind === "once" && own > 0;
  const status = !item ? "" : ownedOnce ? `<span class="pill green">✅ Zaten verildi</span>` : waitingFor.length ? `<span class="pill gold">⏳ ${esc(waitingFor.join(", "))} için gönderildi, oyunu açması bekleniyor</span>`
    : own != null && item.kind !== "once" ? `<span class="pill gray">Oyunda şu an: ${fmtNum(own)}</span>` : "";
  const gName = id => { const g = GAMES.find(x => x.id === id); return g ? `${g.icon} ${esc(g.title)}` : esc(id); };
  const itemsTxt = (items, skipped = []) => items.map(it => skipped.includes(it.key) ? `<s class="muted" title="Oyuncuda zaten vardı">${esc(it.label)}</s>` : esc(it.label)).join(", ");
  $("page").innerHTML = `<div class="stack" style="max-width:1000px">
    <div class="card"><div class="cardHead"><h2>Hediye hazırla</h2><span class="sub right">Birden fazla eşya = paket</span></div><div class="cardBody">
      ${!games.length ? `<p class="muted" style="margin:0">Oyun kataloğu henüz yok.</p>` : `
      <div class="formGrid">
        <div><label class="lbl" for="gTo">Kime</label><select class="field" id="gTo"><option value="*">👥 Herkes (${u.length} hesap)</option>
          ${u.map(x => `<option value="${esc(x.a.name)}" ${x.a.name === gift.to ? "selected" : ""}>${esc(x.a.name)}</option>`).join("")}</select></div>
        <div><label class="lbl" for="gGame">Oyun</label><select class="field" id="gGame">${games.map(g => `<option value="${g.id}" ${g.id === gift.game ? "selected" : ""}>${g.icon} ${esc(g.title)}</option>`).join("")}</select></div>
        <div><label class="lbl" for="gItem">Eşya</label><select class="field" id="gItem">${cat.map((c, i) => `<option value="${i}" ${c === item ? "selected" : ""}>${c.icon} ${esc(c.name)}</option>`).join("")}</select></div>
        ${Object.entries(item.params || {}).map(([p, opts]) => `<div><label class="lbl" for="gp_${p}">${esc(item.paramNames?.[p] || "Seçim")}</label>
          <select class="field" id="gp_${p}" data-param="${p}">${opts.map(o => `<option value="${esc(o[0])}" ${o[0] === gift.vals[p] ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select></div>`).join("")}
        ${item.kind === "once" ? "" : `<div><label class="lbl" for="gN">${item.kind === "amount" ? "Miktar" : "Adet"}</label>
          <input class="field num" type="text" inputmode="numeric" data-num id="gN" value="${fmtNum(item.def || 1)}"><div class="hint">en fazla ${fmtNum(item.max || 1000000000)}</div></div>`}

      <p class="hint" style="margin-top:10px">"Zaten verildi" bilgisi bu cihazdaki oyun kaydından okunur.</p>`}
    </div>
    ${gift.basket.length ? `<div class="cardBody" style="border-top:1px solid var(--line)">
      <label class="lbl" style="margin-top:0">Paket (${gift.basket.length} eşya)</label>
      ${gift.basket.map((b, i) => `<div class="rowLine" style="padding:8px 0"><span>${gName(b.game)}</span><div class="grow"><b>${esc(b.label)}</b></div>
        <button class="btn sm ghost" data-bdel="${i}" aria-label="Çıkar">${ic("x")}</button></div>`).join("")}
      <div class="formGrid" style="margin-top:6px"><div><label class="lbl" for="gNote">Not (oyuncu görmez, kayıtta durur)</label><input class="field" id="gNote" maxlength="60" placeholder="Örn: Yarışma ödülü"></div>
        <div><label class="lbl" for="gPackName">Paketi kaydetmek için isim</label><input class="field" id="gPackName" maxlength="30" placeholder="Örn: Başlangıç Paketi"></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn primary" id="gSend">🎁 ${gift.to === "*" ? `Herkese gönder (${u.length})` : `${esc(gift.to)} adlı oyuncuya gönder`}</button>
        <button class="btn" id="gSavePack">Paketi kaydet</button><button class="btn ghost" id="gClear">Temizle</button></div></div>` : ""}
    </div>
    ${packs.length ? `<div class="card"><div class="cardHead"><h2>Kayıtlı paketler</h2></div><div class="cardBody" style="padding-top:6px">
      ${packs.map((p, i) => `<div class="rowLine"><span class="itemIco">📦</span><div class="grow"><b>${esc(p.name)}</b><small>${p.items.map(b => esc(b.label)).join(", ")}</small></div>
        <button class="btn sm" data-pload="${i}">Pakete yükle</button><button class="btn sm danger" data-pdel="${i}">${ic("trash")}</button></div>`).join("")}</div></div>` : ""}
    <div class="card"><div class="cardHead"><h2>Bekleyen hediyeler</h2><span class="sub">${st.pending.length} hediye · oyuncu oyunu açınca teslim edilir</span></div>
      ${st.pending.length ? `<div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Kime</th><th>Oyun</th><th>Eşyalar</th><th class="hideSm">Gönderilme</th><th></th></tr></thead>
        <tbody>${st.pending.map(p => `<tr><td><b>${esc(p.to)}</b></td><td>${gName(p.game)}</td><td style="white-space:normal">${itemsTxt(p.items)}</td>
          <td class="muted hideSm">${fmtDate(p.at)}</td><td class="r"><button class="btn sm danger" data-gcancel="${esc(p.gid)}">İptal</button></td></tr>`).join("")}</tbody></table></div>`
        : `<div class="cardBody muted">Bekleyen hediye yok.</div>`}</div>
    <div class="card"><div class="cardHead"><h2>Teslim edilenler</h2><span class="sub">son ${st.done.length}</span></div>
      ${st.done.length ? `<div class="tableWrap" style="margin-top:10px"><table><thead><tr><th>Kime</th><th>Oyun</th><th>Eşyalar</th><th>Durum</th><th class="hideSm">Teslim</th></tr></thead>
        <tbody>${st.done.map(d => `<tr><td><b>${esc(d.to)}</b></td><td>${gName(d.game)}</td><td style="white-space:normal">${itemsTxt(d.items, d.skipped || [])}</td>
          <td>${(d.skipped || []).length === d.items.length ? `<span class="pill gray">Zaten vardı</span>` : `<span class="pill green">✅ Verildi</span>`}</td>
          <td class="muted hideSm">${fmtDate(d.got)}</td></tr>`).join("")}</tbody></table></div>`
        : `<div class="cardBody muted">Henüz teslim edilen hediye yok.</div>`}</div>
  </div>`;
  if (!games.length) return;
  $("gTo").onchange = e => { gift.to = e.target.value; renderGifts(); };
  $("gGame").onchange = e => { gift.game = e.target.value; gift.item = 0; gift.vals = {}; renderGifts(); };
  $("gItem").onchange = e => { gift.item = +e.target.value; gift.vals = {}; renderGifts(); };

  $("gAdd").onclick = () => {
    let n = 1;

    const same = gift.basket.find(b => b.key === key && b.game === gift.game);

  };

  });

// ================================================================ Kullanıcı çekmecesi
let drawerUid = null;
function openDrawer(uid) { drawerUid = uid; renderDrawer(); $("drawer").classList.add("on"); $("scrim").classList.add("on"); }
function closeDrawer() { drawerUid = null; $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); }

// Silme onayı: kutuya DELETE yazılmadan buton açılmaz
let confirmOk = null;
function askDelete(name, onOk) {
  confirmOk = onOk;
  $("cIco").innerHTML = ic("alert");
  $("cText").innerHTML = `<b style="color:var(--text)">${esc(name)}</b> hesabı kalıcı olarak silinecek: Robux, avatar, rozetler ve süreler gider. Bu işlem geri alınamaz.<br><br>Onaylamak için kutuya <code>DELETE</code> yaz.`;
  $("cInput").value = ""; $("cOk").disabled = true;
  $("confirm").classList.add("on");
  setTimeout(() => $("cInput").focus(), 30);
}
function closeConfirm() { confirmOk = null; $("confirm").classList.remove("on"); }
$("cInput").addEventListener("input", () => $("cOk").disabled = $("cInput").value.trim() !== "DELETE");
$("cCancel").onclick = closeConfirm;
$("confirm").addEventListener("click", e => { if (e.target.id === "confirm") closeConfirm(); });
$("cForm").onsubmit = e => {
  e.preventDefault();
  if ($("cInput").value.trim() !== "DELETE" || !confirmOk) return;
  const fn = confirmOk; closeConfirm(); fn();
};
function renderDrawer() {

    <div class="dHead">${ava(a)}<div><h2>${esc(a.name)}</h2>${x.active ? `<span class="pill green">Aktif hesap</span>` : `<span class="pill gray">Kayıtlı hesap</span>`}</div>
      <button class="btn ghost" data-act="close" aria-label="Kapat">${ic("x")}</button></div>
    <div class="dBody">
      <div class="sec"><div class="miniStats">
        <div><b class="num">${fmtTime(playSec(a))}</b><span>Oynama</span></div>
        <div><b class="num">R$ ${fmtNum(spentOf(a))}</b><span>Harcama</span></div>

      <div class="sec"><h3 style="color:var(--red)">Tehlikeli bölge</h3><div class="dangerZone">
        <p>Hesap kalıcı olarak silinir: Robux, avatar, rozetler ve süreler gider. Oyunların kendi kayıtları kalır.</p>

$("scrim").onclick = closeDrawer;
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("confirm").classList.contains("on")) closeConfirm(); else if (drawerUid) closeDrawer();
});
$("drawer").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || !sessionOk()) { if (b) logout(); return; }
  const act = b.dataset.act;
  if (act === "close") { closeDrawer(); return; }
  if (act === "gift") { const y = getUser(drawerUid); if (y) gift.to = y.a.name; closeDrawer(); go("gifts"); return; }
  const x = getUser(drawerUid);
  if (!x) { closeDrawer(); return; }
  const a = x.a, amt = $("amt") ? numVal($("amt")) : null;
  const setBal = v => { const old = a.jeton || 0; a.jeton = Math.max(0, v); putUser(x.uid, a); logAct(`${a.name}: Robux R$ ${fmtNum(old)} → R$ ${fmtNum(a.jeton)}`); toast(`${a.name}: R$ ${fmtNum(a.jeton)}`); };
  if (act === "add") setBal((a.jeton || 0) + +b.dataset.n);
  else if (act === "plus" || act === "minus" || act === "set") {
    if (amt === null) { toast("Geçerli bir miktar yaz", true); $("amt").focus(); return; }
    setBal(act === "set" ? amt : (a.jeton || 0) + (act === "plus" ? amt : -amt));
  }
  else if (act === "badge") { a.badges = { ...(a.badges || {}) }; const on = !a.badges[b.dataset.b]; if (on) a.badges[b.dataset.b] = true; else delete a.badges[b.dataset.b]; putUser(x.uid, a);
    const r = BADGES.find(q => q.id === b.dataset.b); logAct(`${a.name}: ${r.icon} ${r.name} rozeti ${on ? "verildi" : "alındı"}`); }
  else if (act === "badgesAll") { a.badges = Object.fromEntries(BADGES.map(r => [r.id, true])); putUser(x.uid, a); logAct(`${a.name}: tüm rozetler verildi`); toast("Tüm rozetler verildi (Robux ödülü yok)"); }
  else if (act === "badgesReset") { a.badges = { welcome: true }; putUser(x.uid, a); logAct(`${a.name}: rozetler sıfırlandı`); toast("Rozetler sıfırlandı"); }
  else if (act === "daily") { a.lastDaily = ""; putUser(x.uid, a); logAct(`${a.name}: günlük ödül yenilendi`); toast("Günlük ödül tekrar alınabilir"); }
  else if (act === "delete") {
    askDelete(a.name, () => {
      // Onay penceresi açıkken liste değişmiş olabilir: aynı ada sahip hesabı taze veriden bul
      const y = getUser(x.uid);
      if (!y || y.a.name !== a.name) { toast("Hesap bulunamadı", true); render(); return; }
      if (y.uid === "a") { try { localStorage.removeItem(KEY); } catch (err) {} }
      else { const accounts = load(ACC_KEY, []); accounts.splice(+y.uid, 1); save(ACC_KEY, accounts); }
      logAct(`Hesap silindi: ${a.name}`); closeDrawer(); toast("Hesap silindi"); render();
    });
    return;
  }
  render();
});

// Sayfa geneli tıklamalar: kullanıcı satırı, "Tümü" bağlantıları, oyun kaydı silme
$("page").addEventListener("click", e => {
  if (!sessionOk()) { logout(); return; }
  const u = e.target.closest("[data-user]"), to = e.target.closest("[data-goto]"), w = e.target.closest("[data-wipe]");
  if (to) go(to.dataset.goto);
  else if (u) openDrawer(u.dataset.user);
  else if (w) {
    const g = GAMES.find(x => x.id === w.dataset.wipe);
    if (!confirm(`${g.title} kaydı silinsin mi? Bu cihazdaki tüm oyuncuların bu oyundaki ilerlemesi gider.`)) return;
    try { localStorage.removeItem(g.saveKey); } catch (err) {}
    const active = load(KEY, null);
    if (active && active.gameStats) { delete active.gameStats[g.id]; save(KEY, active); }
    logAct(`Oyun kaydı silindi: ${g.title}`); toast("Kayıt silindi"); render();
  }
});

// Grafik ipucu (çubuklar)
$("page").addEventListener("mousemove", e => {
  const r = e.target.closest("[data-tip]"), t = $("tip");
  if (!r) { t.style.display = "none"; return; }
  t.innerHTML = r.dataset.tip; t.style.display = "block";
  t.style.left = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8) + "px"; t.style.top = (e.clientY + 14) + "px";
});
$("page").addEventListener("mouseleave", () => $("tip").style.display = "none");

// ================================================================ Başlat
if (sessionOk()) enterApp();
</script>
</body>
